[project]
name = "file-converter-server"
version = "2.0.0"
description = "Микросервис конвертации файлов в текст"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S104"]
"tests/*" = ["S101", "S105"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
